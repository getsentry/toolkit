  commander: ^14.0.0
  dotenv: ^16.6.1
  dotenv-cli: ^8.0.0
  hono: ^4.13.16
  lint-staged: ^15.5.2
  lucide-react: ^0.503.0
  marked: ^15.0.12
  mdast-util-from-markdown: ^2.0.2
  mdast-util-gfm: ^3.1.0
  micromark-extension-gfm: ^3.0.0
  # Keep Dynamic Worker tests on the same Miniflare/workerd runtime as Wrangler.
  miniflare: 5.20261101.0-beta
  msw: ^2.10.2
  open: ^10.1.2
  oxfmt: 0.78.0
  oxlint: 1.93.0
  oxlint-tsgolint: 7.0.2007
  react: ^19.2.8
  react-dom: ^19.2.8
  react-markdown: ^9.1.0
