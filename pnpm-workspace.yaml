packages:
  - apps/*
  - packages/*

patchedDependencies:
  "@cloudflare/workers-oauth-provider@0.10.3": patches/@cloudflare__workers-oauth-provider@0.10.3.patch
  "@stricli/core@1.2.8": packages/cli/patches/@stricli%2Fcore@1.2.8.patch

packageExtensions:
  "@openrouter/ai-sdk-provider@1.5.4":
    dependencies:
      "@ai-sdk/provider": 2.0.3

allowBuilds:
  "@ast-grep/cli": true
  "@sentry/cli": false
  "@tailwindcss/oxide": false
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: false
  sharp: true
  simple-git-hooks: true
  vitest-evals: false
  workerd: true

overrides:
  "ajv@8.20.0>fast-uri": 3.1.8
  "express-rate-limit@8>ip-address": 10.7.4
  "js-yaml@3.15.2>argparse": 2.0.1
  "@modelcontextprotocol/sdk": 1.32.2
  fast-xml-parser: 5.7.2
  "picomatch@2.3.1": 2.3.2
  seroval: ^1.5.4
  sharp: ^0.35.5
  undici: ^7.30.1
  # GHSA-mrhx-c7xc-m3w5: keep every zod copy at or above the patched release.
  zod: ^4.6.6

catalog:
  "@ast-grep/cli": ^0.43.0
  "@ai-sdk/anthropic": ^3.0.33
  "@ai-sdk/mcp": ^1.0.16
  "@ai-sdk/openai": ^3.0.23
  "@ai-sdk/react": ^3.0.232
