  vitest-evals: ^0.18.0
  workers-mcp: 0.1.0-3
  wrangler: 4.156.1
  zod: ^4.6.6

catalogs:
  # `astro check` (@astrojs/check 0.9) supports TypeScript ^5 || ^6 only.
  # Only apps/cli-docs uses this; move it to the default catalog once
  # @astrojs/check supports TypeScript 7.
  astro-check:
    typescript: 6.0.3

