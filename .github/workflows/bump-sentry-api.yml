name: Bump @sentry/api

# Keeps one pull request that pins @sentry/api, which getsentry/sentry releases
# from static/packages/api, to its newest npm release, and moves it to each new
# release. test.yml then checks the CLI, MCP and shared packages against it, so
# this repository validates each release as an outside consumer.
#
# getsentry/sentry dispatches this workflow once npm serves each api@ release;
# the daily run is a fallback. The bump itself is getsentry/sentry's reusable
# bump-sentry-api-consumer.yml.
on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A dispatch and the daily run must not both push the same branch.
concurrency:
  group: bump-sentry-api
  cancel-in-progress: false

jobs:
  bump:
    name: Bump @sentry/api
    uses: getsentry/sentry/.github/workflows/bump-sentry-api-consumer.yml@master
    with:
      pin: catalog
      mode: rolling-pr
      node-version: "22.23.4"
      # The release bot opens the PR, because a PR opened with github.token
      # does not start test.yml.
      app-client-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}
