name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major
      force:
        description: Force release (bypass blockers)
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: "Release a new version"
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@5d869da34e18e7287c1daad50e0b8ea0f506ce69 # v1.11.0
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        name: Install pnpm
        with:
          run_install: false

      - name: Calculate version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT=$(node -p "require('./packages/cli/package.json').version")
          NEW=$(npm exec --yes --package=semver@7.7.2 -- semver -i "$BUMP" "$CURRENT")
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Prepare release
        uses: getsentry/craft@v3
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          # Also publishes @sentry/mcp-server at the same version.
          workspace: packages/cli
          version: ${{ steps.version.outputs.version }}
          force: ${{ inputs.force && 'true' || '' }}
          # GITHUB_TOKEN above is the release bot token for git/GitHub ops.
          # AI changelog summaries use the workflow token for Copilot requests.
          llm_api_key: ${{ github.token }}
