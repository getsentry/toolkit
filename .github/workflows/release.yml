name: Release

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product to release
        required: true
        type: choice
        default: cli
        options:
          - cli
          - logger
      bump:
        description: "Version bump: auto (from commits), pre (next prerelease), or an explicit bump type"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - pre
          - patch
          - minor
          - major
      version:
        description: Exact version to release, such as 1.2.3 (overrides bump)
        required: false
        type: string
        default: ""
      force:
        description: Force release (bypass blockers)
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: "Release a new version"
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@5d869da34e18e7287c1daad50e0b8ea0f506ce69 # v1.11.0
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        name: Install pnpm
        with:
          run_install: false

      - name: Resolve release workspace
        id: release
        env:
          PRODUCT: ${{ inputs.product }}
        run: |
          # Each product maps to a `.craft.yml` workspace. The `cli` release
          # also publishes @sentry/mcp-server at the same version.
          case "$PRODUCT" in
            cli)
              workspace=packages/cli
              ;;
            logger)
              workspace=packages/logger
              ;;
            *)
              echo "::error::Unsupported product: $PRODUCT"
              exit 1
              ;;
          esac

          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"

      - name: Prepare release
        uses: getsentry/craft@v3
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          workspace: ${{ steps.release.outputs.workspace }}
          # An exact version wins over the bump. Craft bumps from the
          # workspace's latest release tag, or from its package.json version
          # before the first tag.
          version: ${{ inputs.version || inputs.bump }}
          force: ${{ inputs.force && 'true' || '' }}
          # GITHUB_TOKEN above is the release bot token for git/GitHub ops.
          # AI changelog summaries use the workflow token for Copilot requests.
          llm_api_key: ${{ github.token }}
