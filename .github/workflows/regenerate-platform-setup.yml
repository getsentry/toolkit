name: Regenerate platform setup data

# Regenerates the create_project platform setup data from Sentry's platform
# list and the published docs tree, and keeps one PR with any changes on the
# bot/regenerate-platform-setup branch. scripts/platform-setup-pr.mjs decides
# whether to open, update, or leave that PR alone.
on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A dispatch and the daily run must not both push the same branch.
concurrency:
  group: regenerate-platform-setup
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate platform setup data
    if: github.repository == 'getsentry/toolkit' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The release bot pushes and opens the PR, because a PR opened with
      # github.token does not start test.yml.
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@5d869da34e18e7287c1daad50e0b8ea0f506ce69 # v1.11.0
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.token.outputs.token }}
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sentry/mcp-core run generate-platform-setup
      - name: Open or update the regeneration PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/platform-setup-pr.mjs
