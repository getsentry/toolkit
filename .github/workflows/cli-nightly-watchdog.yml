name: CLI Nightly Watchdog

# Alerts when the CLI nightly on GHCR stops tracking main: a stuck or failed
# Build run, or a nightly older than the newest built commit. Opens one issue
# while unhealthy, closes it on recovery, and optionally posts both
# transitions to Slack through CLI_NIGHTLY_ALERT_SLACK_WEBHOOK_URL.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: cli-nightly-watchdog
  cancel-in-progress: false

jobs:
  check:
    name: Check CLI nightly health
    if: github.repository == 'getsentry/toolkit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALERT_TITLE: CLI nightly publishing is unhealthy
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.1"
      - name: Assess nightly publishing
        id: assess
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cli-nightly-watchdog.mjs --report "$RUNNER_TEMP/report.md"
      - name: Open, update, or close the alert issue
        id: issue
        env:
          HEALTHY: ${{ steps.assess.outputs.healthy }}
        shell: bash
        run: |
          set -euo pipefail
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            --jq 'map(select(.title == env.ALERT_TITLE and .pull_request == null)) | .[0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '\nLast checked by %s\n' "$run_url" >> "$RUNNER_TEMP/report.md"
          if [[ "$HEALTHY" != "true" ]]; then
            if [[ -n "$number" ]]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
              url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$number"
            else
              url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file "$RUNNER_TEMP/report.md")
              echo "transition=opened" >> "$GITHUB_OUTPUT"
            fi
          elif [[ -n "$number" ]]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $(head -n 1 "$RUNNER_TEMP/report.md") $run_url"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$number"
            echo "transition=resolved" >> "$GITHUB_OUTPUT"
          fi
          echo "url=${url:-}" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        if: steps.issue.outputs.transition != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CLI_NIGHTLY_ALERT_SLACK_WEBHOOK_URL }}
          TRANSITION: ${{ steps.issue.outputs.transition }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::notice::CLI_NIGHTLY_ALERT_SLACK_WEBHOOK_URL is not configured; skipping Slack."
            exit 0
          fi
          if [[ "$TRANSITION" == "opened" ]]; then
            text=":rotating_light: CLI nightly publishing is unhealthy: $ISSUE_URL"
          else
            text=":white_check_mark: CLI nightly publishing recovered: $ISSUE_URL"
          fi
          jq -n --arg text "$text" '{text: $text}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
      - name: Fail while unhealthy
        if: steps.assess.outputs.healthy != 'true'
        env:
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          echo "::error::CLI nightly publishing is unhealthy. See $ISSUE_URL"
          exit 1
