name: Wizard E2E

# `sentry wizard` end-to-end tests: each job sets up Sentry in a real
# framework app, installs its packages, and builds and runs it. They take
# minutes per app, so they run only when the wizard or its tests change.
on:
  pull_request:
    paths:
      - "packages/cli/src/commands/wizard.ts"
      - "packages/cli/src/lib/wizard/**"
      - "packages/cli/test/wizard-e2e/**"
      - "packages/cli/test/mocks/**"
      - ".github/workflows/wizard-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wizard-e2e:
    name: Wizard E2E (${{ matrix.test }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # One job per file in packages/cli/test/wizard-e2e/.
        test:
          - help-message
          - nextjs-14
          - nextjs-15
          - nextjs-16
    env:
      SENTRY_CLIENT_ID: test-client-id
      SENTRY_CLI_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.test }}
        env:
          TEST_FILE: test/wizard-e2e/${{ matrix.test }}.test.ts
        run: pnpm --filter sentry run test:wizard-e2e "$TEST_FILE"
