name: Post-merge tasks

on:
  push:
    branches: ["main", "release/*", "release/mcp/**"]
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm --filter '@sentry/mcp-core...' --if-present run build

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test:ci

      # @sentry/mcp-server bundles the CLI's `sentry mcp` server into one file.
      - name: Bundle mcp-server
        env:
          SENTRY_CLIENT_ID: ${{ vars.SENTRY_CLIENT_ID }}
        run: pnpm --filter @sentry/mcp-server run bundle

      - name: Test mcp-server bundle
        run: pnpm --filter @sentry/mcp-server run test:bundle

      - name: Package mcp-server
        working-directory: packages/mcp-server
        run: pnpm pack --pack-destination dist

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: |
            ${{ github.workspace }}/packages/mcp-server/dist/*.tgz

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@cf701569b05ccdd861a76b8607a66d76f6fd4857
        if: ${{ !cancelled() }}
        with:
          report_paths: "**/*.junit.xml"
          comment: false
