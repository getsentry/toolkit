name: Post-merge tasks

on:
  push:
    branches: ["main", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every Craft workspace without its own artifact provider is an npm
  # library whose tarball this workflow builds.
  discover-packages:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      # The same major version as release.yml's getsentry/craft@v3.
      - name: Install Craft
        run: npm install --global @sentry/craft@3 # zizmor: ignore[adhoc-packages]

      - name: List packages
        id: packages
        run: node scripts/npm-library-workspaces.mjs

  package:
    needs: discover-packages
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.discover-packages.outputs.matrix) }}
    name: Package ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: pnpm --filter "{./$WORKSPACE}..." --if-present run build

      - name: Package
        working-directory: ${{ matrix.workspace }}
        run: pnpm pack --pack-destination dist

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.name }}
          path: ${{ matrix.workspace }}/dist/*.tgz
          if-no-files-found: error

  # Craft reads every tarball from one artifact named after the commit.
  archive:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Archive artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: ${{ github.sha }}
          pattern: npm-*
          delete-merged: true
