name: Post-merge tasks

on:
  push:
    branches: ["main", "release/*", "release/mcp/**", "release/telemetry/**"]
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm --filter '@sentry/mcp-server...' --if-present run build

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test:ci

      - name: Package mcp-server
        working-directory: packages/mcp-server
        run: pnpm pack --pack-destination dist

      - name: Package telemetry
        working-directory: packages/telemetry
        run: pnpm pack --pack-destination dist

      - name: Check packed telemetry consumer
        working-directory: packages/telemetry
        run: node scripts/check-package.mjs dist/sentry-telemetry-*.tgz

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: |
            ${{ github.workspace }}/packages/mcp-server/dist/*.tgz

      - name: Archive telemetry artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentry-telemetry-${{ github.sha }}
          path: ${{ github.workspace }}/packages/telemetry/dist/*.tgz
          if-no-files-found: error

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@cf701569b05ccdd861a76b8607a66d76f6fd4857
        if: ${{ !cancelled() }}
        with:
          report_paths: "**/*.junit.xml"
          comment: false
