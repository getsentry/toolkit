name: Post-merge tasks

on:
  push:
    branches: ["main", "release/*", "release/logger/**", "release/wizard/**"]
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm --filter '@sentry/mcp-core...' --filter @sentry/logger --if-present run build

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test:ci

      - name: Package logger
        working-directory: packages/logger
        run: pnpm pack --pack-destination dist

      - name: Package wizard
        working-directory: packages/wizard
        run: pnpm pack --pack-destination dist

      # Craft's logger and wizard workspaces both read this artifact; each npm
      # target picks its own tarball by name.
      - name: Archive artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ github.sha }}
          path: |
            ${{ github.workspace }}/packages/logger/dist/*.tgz
            ${{ github.workspace }}/packages/wizard/dist/*.tgz

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@cf701569b05ccdd861a76b8607a66d76f6fd4857
        if: ${{ !cancelled() }}
        with:
          report_paths: "**/*.junit.xml"
          comment: false
