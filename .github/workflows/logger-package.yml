name: Logger Package

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/logger-package.yml"
      - "packages/logger/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  package-consumer:
    name: Clean Consumer Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pnpm/action-setup@v4
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The workspace imports the TypeScript source; the packed package.json
      # must point its exports at dist/ instead (publishConfig.exports).
      # The consumer project lives in packages/logger/test/package/consumer.
      - name: Pack and check from a clean consumer
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: pnpm --filter @sentry/logger run test:package
