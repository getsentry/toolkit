name: Publish MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable @sentry/mcp-server version (e.g. 0.48.0)
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Key on the release tag so a manual retry of `0.48.0` queues behind the
# `cli@0.48.0` release run instead of racing it to publish the same version.
concurrency:
  group: mcp-registry-${{ github.event_name == 'release' && github.event.release.tag_name || format('cli@{0}', inputs.version) }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.repository == 'getsentry/sentry-mcp' || github.repository == 'getsentry/toolkit') &&
      ((github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'cli@')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      INPUT_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      # Use the maintained manifest on main, including for older releases.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      # Each CLI release (`cli@<version>`) publishes @sentry/mcp-server at the
      # same version. Releases before that used bare `<version>` tags.
      - name: Resolve release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            tag="$RELEASE_TAG"
          elif gh release view "cli@$INPUT_VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            tag="cli@$INPUT_VERSION"
          else
            tag="$INPUT_VERSION"
          fi
          version="${tag#cli@}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            | jq -e '(.isDraft | not) and (.isPrerelease | not)'
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare metadata
        run: |
          jq --arg version "$VERSION" '.version = $version | .packages[0].version = $version' \
            server.json > "$RUNNER_TEMP/server.json"

          # Craft publishes the GitHub release before npm. Wait for the exact package.
          curl --fail --silent --show-error --retry 40 --retry-all-errors \
            --retry-delay 15 --retry-max-time 600 --max-time 15 \
            "https://registry.npmjs.org/@sentry%2Fmcp-server/$VERSION" \
            -o "$RUNNER_TEMP/npm.json"
          jq -e --arg version "$VERSION" --slurpfile manifest "$RUNNER_TEMP/server.json" \
            '.name == "@sentry/mcp-server" and .version == $version and .mcpName == $manifest[0].name' \
            "$RUNNER_TEMP/npm.json"

      - name: Check for an existing listing
        id: existing
        run: |
          url="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.getsentry%2Fsentry-mcp/versions/$VERSION"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          status=$(curl --silent --show-error --max-time 30 -o "$RUNNER_TEMP/existing.json" -w '%{http_code}' "$url")
          case "$status" in
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            200) ;; # Verify the existing record below instead of republishing it.
            *) echo "Registry lookup failed: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Install MCP publisher
        if: steps.existing.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        env:
          # Update both from https://github.com/modelcontextprotocol/registry/releases
          # Use the mcp-publisher_linux_amd64.tar.gz entry in registry_<version>_checksums.txt.
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            -o mcp-publisher.tar.gz
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish metadata
        if: steps.existing.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Verify listing
        env:
          REGISTRY_URL: ${{ steps.existing.outputs.url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 15 \
            "$REGISTRY_URL" -o "$RUNNER_TEMP/published.json"
          jq -e --slurpfile expected "$RUNNER_TEMP/server.json" \
            '(.server | del(.["$schema"])) == ($expected[0] | del(.["$schema"])) and
             ._meta["io.modelcontextprotocol.registry/official"].status == "active"' \
            "$RUNNER_TEMP/published.json"
