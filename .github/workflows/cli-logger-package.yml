name: CLI Logger Package

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/cli-logger-package.yml"
      - "packages/cli-logger/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  package-consumer:
    name: Clean Consumer Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pnpm/action-setup@v4
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and pack
        run: |
          pnpm --filter @sentry/cli-logger run build
          pnpm --dir packages/cli-logger pack --pack-destination "$RUNNER_TEMP"

      # The workspace imports the TypeScript source; the packed package.json
      # must point its exports at dist/ instead (publishConfig.exports).
      - name: Import and typecheck from a clean consumer
        shell: bash
        run: |
          set -euo pipefail

          consumer="$RUNNER_TEMP/cli-logger-consumer"
          mkdir -p "$consumer"
          cd "$consumer"

          export npm_config_cache="$RUNNER_TEMP/npm-cache"
          echo '{ "private": true, "type": "module" }' > package.json
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/sentry-cli-logger-*.tgz @clack/prompts@0.11.0 typescript@^5.8.3 @types/node@^22

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "noEmit": true,
              "strict": true,
              "target": "ES2022"
            },
            "include": ["index.ts", "require.cts"]
          }
          EOF

          cat > index.ts <<'EOF'
          import { createLogger, type LogObject } from "@sentry/cli-logger";
          import { clackPrompt } from "@sentry/cli-logger/prompt";

          const records: LogObject[] = [];
          const logger = createLogger({ prompt: clackPrompt });
          logger.addReporter({ log: (logObj) => records.push(logObj) });
          logger.withTag("consumer").info("hello");
          const answer: Promise<boolean | symbol> = logger.prompt("Continue?", {
            type: "confirm",
          });
          void answer;
          EOF

          cat > require.cts <<'EOF'
          import logger = require("@sentry/cli-logger");
          logger.createLogger().info("hello");
          EOF

          npx tsc --noEmit

          CI=1 node --input-type=module -e '
            import { createLogger } from "@sentry/cli-logger";
            import { clackPrompt } from "@sentry/cli-logger/prompt";
            createLogger({ prompt: clackPrompt }).withTag("esm").info("ok");
          ' 2>&1 | grep -Fx "[info] [esm] ok"
          CI=1 node -e '
            const { createLogger } = require("@sentry/cli-logger");
            require("@sentry/cli-logger/prompt");
            createLogger().withTag("cjs").info("ok");
          ' 2>&1 | grep -Fx "[info] [cjs] ok"
