name: MCP Deploy Watchdog

# Alerts when production MCP deployments fail, ignoring runs that only refused
# a revision superseded on main. Opens one issue while unhealthy, closes it on
# the next successful deployment, and optionally posts both transitions to
# Slack through MCP_DEPLOY_ALERT_SLACK_WEBHOOK_URL.

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: mcp-deploy-watchdog
  cancel-in-progress: false

jobs:
  check:
    name: Check MCP deployment health
    if: github.repository == 'getsentry/toolkit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALERT_TITLE: MCP production deployments are failing
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.1"
      - name: Assess deployments
        id: assess
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/mcp-deploy-watchdog.mjs --report "$RUNNER_TEMP/report.md"
      - name: Open, update, or close the alert issue
        id: issue
        env:
          HEALTHY: ${{ steps.assess.outputs.healthy }}
        shell: bash
        run: |
          set -euo pipefail
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            --jq 'map(select(.title == env.ALERT_TITLE and .pull_request == null)) | .[0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '\nLast checked by %s\n' "$run_url" >> "$RUNNER_TEMP/report.md"
          if [[ "$HEALTHY" != "true" ]]; then
            if [[ -n "$number" ]]; then
              gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
              url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$number"
            else
              url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file "$RUNNER_TEMP/report.md")
              echo "transition=opened" >> "$GITHUB_OUTPUT"
            fi
          elif [[ -n "$number" ]]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $(head -n 1 "$RUNNER_TEMP/report.md") $run_url"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/issues/$number"
            echo "transition=resolved" >> "$GITHUB_OUTPUT"
          fi
          echo "url=${url:-}" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        if: steps.issue.outputs.transition != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.MCP_DEPLOY_ALERT_SLACK_WEBHOOK_URL }}
          TRANSITION: ${{ steps.issue.outputs.transition }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::notice::MCP_DEPLOY_ALERT_SLACK_WEBHOOK_URL is not configured; skipping Slack."
            exit 0
          fi
          if [[ "$TRANSITION" == "opened" ]]; then
            text=":rotating_light: MCP production deployments are failing: $ISSUE_URL"
          else
            text=":white_check_mark: MCP production deployments recovered: $ISSUE_URL"
          fi
          jq -n --arg text "$text" '{text: $text}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
