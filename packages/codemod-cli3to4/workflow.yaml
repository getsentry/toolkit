# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: apply-transforms
    name: Apply AST Transformations
    type: automatic
    steps:
      - name: "Scan JavaScript and TypeScript files and apply fixes"
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "typescript"
          include:
            - "**/*.{js,mjs,cjs,ts,mts,cts}"
          exclude: &exclude
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      # JSX needs the tsx grammar; the typescript grammar can't parse it.
      - name: "Scan JSX and TSX files and apply fixes"
        js-ast-grep:
          js_file: scripts/codemod.ts
          base_path: "."
          language: "tsx"
          include:
            - "**/*.{jsx,tsx}"
          exclude: *exclude
