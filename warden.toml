version = 1

[defaults]
failOn = "high"
reportOn = "low"

[defaults.ignore]
paths = [
  # Generated artifacts intentionally committed to the repository.
  "pnpm-lock.yaml",
  "packages/mcp-core/src/*Definitions.json",
  "plugins/sentry-mcp*/agents/sentry-mcp.md",
  "packages/mcp-cloudflare/worker-configuration.d.ts",
  "packages/mcp-core/src/internal/agents/tools/data/*.json",
  "!packages/mcp-core/src/internal/agents/tools/data/app.json",
]

[[skills]]
name = "mcp-audit"
paths = [
  "docs/contributing/adding-tools.md",
  "docs/contributing/tool-responses.md",
  "docs/operations/stdio-auth.md",
  "packages/mcp-core/src/server.ts",
  "packages/mcp-core/src/server.test.ts",
  "packages/mcp-core/src/skillDefinitions.json",
  "packages/mcp-core/src/toolDefinitions.json",
  "packages/mcp-core/src/tools/**",
  "packages/mcp-core/src/transports/**",
  "packages/cli/src/lib/mcp.ts",
  "packages/cli/src/lib/mcp/**",
  "packages/mcp-cloudflare/src/server/app.ts",
  "packages/mcp-cloudflare/src/server/index.ts",
  "packages/mcp-cloudflare/src/server/authorization-server-metadata.ts",
  "packages/mcp-cloudflare/src/server/protected-resource-metadata.ts",
  "packages/mcp-cloudflare/src/server/lib/mcp-handler.ts",
  "packages/mcp-cloudflare/src/server/oauth/**",
  "packages/mcp-cloudflare/src/server/routes/chat-oauth.ts",
  "packages/mcp-cloudflare/src/server/routes/mcp.ts",
  "packages/mcp-cloudflare/src/server/routes/metadata.ts",
  "packages/mcp-cloudflare/src/server/utils/auth-errors.ts",
  "packages/mcp-cloudflare/src/server/utils/cors.ts",
  "packages/mcp-cloudflare/src/server/utils/rate-limiter.ts",
]

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]

[[skills]]
name = "code-review"

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened"]

[[skills.triggers]]
type = "local"
